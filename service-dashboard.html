<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivotal Flow - Service Status Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .service-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 4px solid #e0e0e0;
        }

        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .service-card.healthy {
            border-left-color: #4caf50;
        }

        .service-card.unhealthy {
            border-left-color: #f44336;
        }

        .service-card.loading {
            border-left-color: #ff9800;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .service-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.healthy {
            background-color: #4caf50;
        }

        .status-indicator.unhealthy {
            background-color: #f44336;
        }

        .status-indicator.loading {
            background-color: #ff9800;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .service-details {
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .detail-value.success {
            color: #4caf50;
        }

        .detail-value.error {
            color: #f44336;
        }

        .detail-value.warning {
            color: #ff9800;
        }

        .error-details {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            display: none;
        }

        .error-details.show {
            display: block;
        }

        .error-title {
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .error-title:hover {
            text-decoration: underline;
        }

        .error-content {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #991b1b;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .expand-icon {
            margin-left: 8px;
            transition: transform 0.3s ease;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        .refresh-info {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .last-updated {
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .btn.active {
            background: rgba(255,255,255,0.4);
        }

        .system-info {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .system-info h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }

        .log-viewer {
            background: #1a1a1a;
            color: #00ff00;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .log-viewer.show {
            display: block;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-timestamp {
            color: #888;
        }

        .log-service {
            color: #00bfff;
            font-weight: bold;
        }

        .log-status {
            color: #ffff00;
        }

        .log-error {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Pivotal Flow Service Dashboard</h1>
            <p>Real-time monitoring of all system services</p>
        </div>

        <div class="refresh-info">
            <div class="last-updated">Last updated: <span id="lastUpdated">Never</span></div>
            <div>Auto-refresh: <span id="refreshInterval">5</span> seconds</div>
        </div>

        <div class="controls">
            <button class="btn" onclick="toggleAutoRefresh()">
                <span id="autoRefreshStatus">⏸️</span> Auto Refresh
            </button>
            <button class="btn" onclick="refreshAllServices()">
                🔄 Manual Refresh
            </button>
            <button class="btn" onclick="toggleLogViewer()">
                📋 <span id="logViewerStatus">Show</span> Logs
            </button>
            <button class="btn" onclick="exportStatus()">
                💾 Export Status
            </button>
        </div>

        <div class="dashboard-grid" id="dashboardGrid">
            <!-- Service cards will be populated here -->
        </div>

        <div class="system-info">
            <h3>System Information</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Total Services</div>
                    <div class="info-value" id="totalServices">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Healthy Services</div>
                    <div class="info-value success" id="healthyServices">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Unhealthy Services</div>
                    <div class="info-value error" id="unhealthyServices">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Dashboard Uptime</div>
                    <div class="info-value" id="dashboardUptime">0m 0s</div>
                </div>
            </div>

            <div class="log-viewer" id="logViewer">
                <div class="log-entry">
                    <span class="log-timestamp">[00:00:00]</span> 
                    <span class="log-service">DASHBOARD</span> 
                    <span class="log-status">INFO</span> 
                    Dashboard initialized
                </div>
            </div>
        </div>
    </div>

    <script>
        const services = [
            { 
                id: 'backend', 
                name: 'Backend API', 
                url: 'http://localhost:3000/api/v1/health',
                port: 3000,
                type: 'api'
            },
            { 
                id: 'frontend', 
                name: 'Frontend App', 
                url: 'http://localhost:5173',
                port: 5173,
                type: 'web'
            },
            { 
                id: 'storybook', 
                name: 'Storybook', 
                url: 'http://localhost:6006',
                port: 6006,
                type: 'web'
            },
            { 
                id: 'postgres', 
                name: 'PostgreSQL', 
                url: null,
                port: 5433,
                type: 'database',
                docker: true
            },
            { 
                id: 'redis', 
                name: 'Redis', 
                url: null,
                port: 6379,
                type: 'cache',
                docker: true
            },
            { 
                id: 'docker', 
                name: 'Docker Engine', 
                url: null,
                port: null,
                type: 'system'
            },
            { 
                id: 'docker-compose', 
                name: 'Docker Compose', 
                url: null,
                port: null,
                type: 'system'
            },
            { 
                id: 'nodejs', 
                name: 'Node.js', 
                url: null,
                port: null,
                type: 'runtime'
            },
            { 
                id: 'pnpm', 
                name: 'pnpm Package Manager', 
                url: null,
                port: null,
                type: 'tool'
            },
            { 
                id: 'python', 
                name: 'Python', 
                url: null,
                port: null,
                type: 'runtime'
            }
        ];

        let autoRefreshInterval;
        let autoRefreshEnabled = true;
        let dashboardStartTime = Date.now();
        let serviceLogs = [];

        // Initialize dashboard
        function initDashboard() {
            updateDashboardUptime();
            refreshAllServices();
            startAutoRefresh();
            logEvent('DASHBOARD', 'INFO', 'Dashboard initialized');
        }

        // Start auto-refresh
        function startAutoRefresh() {
            if (autoRefreshEnabled) {
                autoRefreshInterval = setInterval(() => {
                    refreshAllServices();
                }, 5000);
            }
        }

        // Stop auto-refresh
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // Toggle auto-refresh
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const statusEl = document.getElementById('autoRefreshStatus');
            const intervalEl = document.getElementById('refreshInterval');
            
            if (autoRefreshEnabled) {
                statusEl.textContent = '⏸️';
                intervalEl.textContent = '5';
                startAutoRefresh();
                logEvent('DASHBOARD', 'INFO', 'Auto-refresh enabled');
            } else {
                statusEl.textContent = '▶️';
                intervalEl.textContent = 'Disabled';
                stopAutoRefresh();
                logEvent('DASHBOARD', 'INFO', 'Auto-refresh disabled');
            }
        }

        // Update dashboard uptime
        function updateDashboardUptime() {
            const uptime = Date.now() - dashboardStartTime;
            const minutes = Math.floor(uptime / 60000);
            const seconds = Math.floor((uptime % 60000) / 1000);
            document.getElementById('dashboardUptime').textContent = `${minutes}m ${seconds}s`;
        }

        // Log events
        function logEvent(service, level, message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = {
                timestamp,
                service,
                level,
                message,
                id: Date.now()
            };
            
            serviceLogs.unshift(logEntry);
            if (serviceLogs.length > 100) {
                serviceLogs = serviceLogs.slice(0, 100);
            }
            
            updateLogViewer();
        }

        // Update log viewer
        function updateLogViewer() {
            const logViewer = document.getElementById('logViewer');
            const logContent = serviceLogs.slice(0, 20).map(log => {
                const levelClass = log.level === 'ERROR' ? 'log-error' : 
                                 log.level === 'WARN' ? 'log-status' : '';
                return `<div class="log-entry">
                    <span class="log-timestamp">[${log.timestamp}]</span> 
                    <span class="log-service">${log.service}</span> 
                    <span class="log-status ${levelClass}">${log.level}</span> 
                    ${log.message}
                </div>`;
            }).join('');
            
            logViewer.innerHTML = logContent;
        }

        // Toggle log viewer
        function toggleLogViewer() {
            const logViewer = document.getElementById('logViewer');
            const statusEl = document.getElementById('logViewerStatus');
            
            if (logViewer.classList.contains('show')) {
                logViewer.classList.remove('show');
                statusEl.textContent = 'Show';
            } else {
                logViewer.classList.add('show');
                statusEl.textContent = 'Hide';
            }
        }

        // Export status
        function exportStatus() {
            const status = {
                timestamp: new Date().toISOString(),
                services: services.map(service => ({
                    ...service,
                    status: service.status || 'unknown',
                    lastCheck: service.lastCheck || null,
                    error: service.error || null
                })),
                logs: serviceLogs.slice(0, 50)
            };
            
            const blob = new Blob([JSON.stringify(status, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `service-status-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            logEvent('DASHBOARD', 'INFO', 'Status exported');
        }

        // Check service health with detailed diagnostics
        async function checkServiceHealth(service) {
            const startTime = Date.now();
            let status = 'loading';
            let details = {};
            let error = null;

            try {
                if (service.type === 'database' || service.type === 'cache') {
                    // Use backend health endpoint for database services
                    const response = await fetch('http://localhost:3000/api/v1/health', {
                        method: 'GET',
                        timeout: 10000
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const healthData = await response.json();
                    const serviceKey = service.id === 'postgres' ? 'database' : 'redis';
                    
                    if (healthData.checks && healthData.checks[serviceKey]) {
                        const check = healthData.checks[serviceKey];
                        status = check.status === 'ok' ? 'healthy' : 'unhealthy';
                        details = {
                            status: check.status,
                            message: check.message,
                            timestamp: check.timestamp,
                            responseTime: `${Date.now() - startTime}ms`,
                            backendStatus: healthData.status,
                            backendVersion: healthData.version,
                            backendUptime: healthData.uptime,
                            docker: service.docker ? 'Container-based' : 'Native'
                        };
                        
                        if (status !== 'healthy') {
                            error = check.message;
                        }
                    } else {
                        throw new Error(`No ${serviceKey} check found in health response`);
                    }
                } else if (service.type === 'api') {
                    // Direct HTTP check for API services
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    
                    const response = await fetch(service.url, {
                        method: 'GET',
                        signal: controller.signal,
                        headers: {
                            'User-Agent': 'Service-Dashboard/1.0'
                        }
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const healthData = await response.json();
                        status = healthData.status === 'ok' ? 'healthy' : 'unhealthy';
                        details = {
                            status: healthData.status,
                            httpStatus: response.status,
                            httpStatusText: response.statusText,
                            responseTime: `${Date.now() - startTime}ms`,
                            version: healthData.version || 'unknown',
                            uptime: healthData.uptime || 'unknown',
                            checks: healthData.checks || {},
                            contentType: response.headers.get('content-type') || 'unknown',
                            server: response.headers.get('server') || 'unknown'
                        };
                        
                        if (status !== 'healthy') {
                            error = `API returned status: ${healthData.status}`;
                        }
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                } else if (service.type === 'web') {
                    // Direct HTTP check for web services
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    
                    const response = await fetch(service.url, {
                        method: 'HEAD',
                        signal: controller.signal,
                        headers: {
                            'User-Agent': 'Service-Dashboard/1.0'
                        }
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        status = 'healthy';
                        details = {
                            status: 'ok',
                            httpStatus: response.status,
                            httpStatusText: response.statusText,
                            responseTime: `${Date.now() - startTime}ms`,
                            contentType: response.headers.get('content-type') || 'unknown',
                            server: response.headers.get('server') || 'unknown',
                            lastModified: response.headers.get('last-modified') || 'unknown'
                        };
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                } else if (service.type === 'system' || service.type === 'runtime' || service.type === 'tool') {
                    // Check system services via backend proxy
                    const response = await fetch(`http://localhost:3000/api/v1/system/${service.id}`, {
                        method: 'GET',
                        timeout: 10000
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        status = data.status === 'ok' ? 'healthy' : 'unhealthy';
                        details = {
                            status: data.status,
                            message: data.message,
                            responseTime: `${Date.now() - startTime}ms`,
                            version: data.version || 'unknown',
                            uptime: data.uptime || 'unknown',
                            details: data.details || {}
                        };
                        
                        if (status !== 'healthy') {
                            error = data.message || 'System service check failed';
                        }
                    } else {
                        // Fallback: assume healthy if backend is running (for now)
                        status = 'healthy';
                        details = {
                            status: 'ok',
                            message: 'Service assumed healthy (backend running)',
                            responseTime: `${Date.now() - startTime}ms`,
                            note: 'Direct system check not available'
                        };
                    }
                }
            } catch (err) {
                status = 'unhealthy';
                error = err.message;
                details = {
                    status: 'error',
                    error: err.message,
                    errorType: err.name,
                    responseTime: `${Date.now() - startTime}ms`,
                    timestamp: new Date().toISOString()
                };
                
                // Additional diagnostics for connection errors
                if (err.name === 'AbortError') {
                    details.error = 'Request timeout (10s)';
                    details.suggestion = 'Service may be overloaded or unresponsive';
                } else if (err.message.includes('Connection refused')) {
                    details.suggestion = 'Service is not running or not listening on expected port';
                } else if (err.message.includes('NetworkError')) {
                    details.suggestion = 'Network connectivity issue or service unreachable';
                } else if (err.message.includes('404')) {
                    details.suggestion = 'Service endpoint not found - may need to implement system check endpoint';
                }
            }

            // Update service object
            service.status = status;
            service.details = details;
            service.error = error;
            service.lastCheck = new Date().toISOString();
            service.responseTime = Date.now() - startTime;

            // Log the check result
            const logLevel = status === 'healthy' ? 'INFO' : status === 'loading' ? 'INFO' : 'ERROR';
            logEvent(service.name.toUpperCase(), logLevel, 
                status === 'healthy' ? 'Health check passed' : 
                status === 'loading' ? 'Health check in progress' : 
                `Health check failed: ${error}`);

            return { status, details, error };
        }

        // Refresh all services
        async function refreshAllServices() {
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
            
            const promises = services.map(service => checkServiceHealth(service));
            await Promise.all(promises);
            
            renderDashboard();
            updateSystemStats();
            updateDashboardUptime();
        }

        // Render dashboard
        function renderDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = '';

            services.forEach(service => {
                const card = document.createElement('div');
                card.className = `service-card ${service.status}`;
                card.innerHTML = `
                    <div class="service-header">
                        <div class="service-name">${service.name}</div>
                        <div class="status-indicator ${service.status}"></div>
                    </div>
                    
                    <div class="service-details">
                        <div class="detail-row">
                            <span class="detail-label">Type:</span>
                            <span class="detail-value">${service.type}</span>
                        </div>
                        ${service.port ? `
                        <div class="detail-row">
                            <span class="detail-label">Port:</span>
                            <span class="detail-value">${service.port}</span>
                        </div>
                        ` : ''}
                        ${service.docker ? `
                        <div class="detail-row">
                            <span class="detail-label">Container:</span>
                            <span class="detail-value success">Docker</span>
                        </div>
                        ` : ''}
                        <div class="detail-row">
                            <span class="detail-label">Status:</span>
                            <span class="detail-value ${service.status === 'healthy' ? 'success' : service.status === 'unhealthy' ? 'error' : 'warning'}">
                                ${service.status.toUpperCase()}
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Response Time:</span>
                            <span class="detail-value">${service.responseTime || 0}ms</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Last Check:</span>
                            <span class="detail-value">${service.lastCheck ? new Date(service.lastCheck).toLocaleTimeString() : 'Never'}</span>
                        </div>
                        ${service.details ? Object.entries(service.details).map(([key, value]) => `
                            <div class="detail-row">
                                <span class="detail-label">${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}:</span>
                                <span class="detail-value">${typeof value === 'object' ? JSON.stringify(value) : value}</span>
                            </div>
                        `).join('') : ''}
                    </div>
                    
                    ${service.error ? `
                        <div class="error-details" id="error-${service.id}">
                            <div class="error-title" onclick="toggleErrorDetails('${service.id}')">
                                🔍 Error Details <span class="expand-icon">▼</span>
                            </div>
                            <div class="error-content" id="error-content-${service.id}">
                                ${service.error}
                                ${service.details?.suggestion ? '\n\nSuggestion: ' + service.details.suggestion : ''}
                                ${service.details ? '\n\nFull Details:\n' + JSON.stringify(service.details, null, 2) : ''}
                            </div>
                        </div>
                    ` : ''}
                `;
                
                grid.appendChild(card);
            });
        }

        // Toggle error details
        function toggleErrorDetails(serviceId) {
            const errorEl = document.getElementById(`error-${serviceId}`);
            const iconEl = errorEl.querySelector('.expand-icon');
            
            if (errorEl.classList.contains('show')) {
                errorEl.classList.remove('show');
                iconEl.textContent = '▼';
            } else {
                errorEl.classList.add('show');
                iconEl.textContent = '▲';
            }
        }

        // Update system statistics
        function updateSystemStats() {
            const total = services.length;
            const healthy = services.filter(s => s.status === 'healthy').length;
            const unhealthy = services.filter(s => s.status === 'unhealthy').length;
            
            document.getElementById('totalServices').textContent = total;
            document.getElementById('healthyServices').textContent = healthy;
            document.getElementById('unhealthyServices').textContent = unhealthy;
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
