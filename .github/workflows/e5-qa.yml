name: E5 QA Pipeline

on:
  push:
    branches: [ epic-FE-1, main ]
  pull_request:
    branches: [ epic-FE-1, main ]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # Unit Tests and Linting
  unit-tests:
    name: Unit Tests & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type checking
        run: pnpm -w typecheck

      - name: ESLint
        run: pnpm -w lint

      - name: Unit tests with coverage
        run: pnpm test --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/frontend/coverage/lcov.info
          flags: frontend-unit-tests
          name: frontend-coverage

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build frontend
        run: pnpm build

      - name: Start frontend server
        run: |
          pnpm preview --port 5173 &
          sleep 10
        env:
          NODE_ENV: production

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 30

  # Docker Compose Integration Tests
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          sleep 30

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Run integration tests
        run: |
          cd apps/frontend
          pnpm exec playwright test tests/e2e/smoke.spec.ts --project=chromium
        env:
          CI: true

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  # Accessibility Testing
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run accessibility tests
        run: pnpm test -- --testNamePattern="accessibility"

      - name: Run axe-core tests
        run: pnpm test -- --testNamePattern="axe"

  # Build and Deploy Preview
  build-preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: apps/frontend/dist/
          retention-days: 7

  # QA Gate Summary
  qa-summary:
    name: QA Gate Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, docker-integration, accessibility-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate QA Report
        run: |
          echo "## E5 QA Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Integration | ${{ needs.docker-integration.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Test Coverage: Target 80%+" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Test Coverage: Critical user flows" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility: WCAG AA compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review any failed tests" >> $GITHUB_STEP_SUMMARY
          echo "2. Address accessibility violations" >> $GITHUB_STEP_SUMMARY
          echo "3. Update test coverage if below target" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any tests failed
        if: needs.unit-tests.result == 'failure' || needs.e2e-tests.result == 'failure' || needs.docker-integration.result == 'failure' || needs.accessibility-tests.result == 'failure'
        run: |
          echo "❌ QA Gate Failed - One or more test suites failed"
          exit 1

      - name: Success message
        if: needs.unit-tests.result == 'success' && needs.e2e-tests.result == 'success' && needs.docker-integration.result == 'success' && needs.accessibility-tests.result == 'success'
        run: |
          echo "✅ All QA Gates Passed - Ready for deployment"
