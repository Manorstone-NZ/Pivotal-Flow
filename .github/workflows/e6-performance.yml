name: E6 Performance & Analytics Pipeline

on:
  push:
    branches: [ epic-FE-1, main ]
  pull_request:
    branches: [ epic-FE-1, main ]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # Performance Monitoring
  performance-tests:
    name: Performance & Bundle Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend with source maps
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Run bundle budget check
        run: pnpm perf:budget
        continue-on-error: false

      - name: Generate performance report
        run: pnpm perf:monitor
        continue-on-error: true

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bundle-analysis
          path: |
            apps/frontend/dist/stats.html
            apps/frontend/dist/stats.json
            plans/E6_perf_report.md
          retention-days: 30

  # Lighthouse Performance Audit
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm preview --port 3000 &
          sleep 5

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouse.config.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

  # Bundle Size Monitoring
  bundle-size-monitor:
    name: Bundle Size Monitoring
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Analyze bundle sizes
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          
          # Analyze JS files
          find dist -name "*.js" -exec sh -c '
            size=$(stat -c%s "$1")
            size_kb=$((size / 1024))
            echo "| $1 | ${size_kb}KB | ~$((size_kb * 30 / 100))KB |" >> $GITHUB_STEP_SUMMARY
          ' _ {} \;
          
          # Analyze CSS files
          find dist -name "*.css" -exec sh -c '
            size=$(stat -c%s "$1")
            size_kb=$((size / 1024))
            echo "| $1 | ${size_kb}KB | ~$((size_kb * 20 / 100))KB |" >> $GITHUB_STEP_SUMMARY
          ' _ {} \;

      - name: Check bundle size limits
        run: |
          # Check if any JS file exceeds 200KB
          large_files=$(find dist -name "*.js" -size +200k)
          if [ -n "$large_files" ]; then
            echo "❌ Bundle size limit exceeded!"
            echo "Large files: $large_files"
            exit 1
          fi
          
          # Check total bundle size
          total_size=$(find dist -name "*.js" -exec stat -c%s {} + | awk '{sum+=$1} END {print sum}')
          total_size_kb=$((total_size / 1024))
          
          if [ $total_size_kb -gt 500 ]; then
            echo "❌ Total bundle size exceeds 500KB: ${total_size_kb}KB"
            exit 1
          fi
          
          echo "✅ Bundle size check passed: ${total_size_kb}KB"

  # Performance Regression Testing
  performance-regression:
    name: Performance Regression Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run performance regression tests
        run: |
          # Start server
          pnpm preview --port 3000 &
          sleep 5
          
          # Run performance tests
          pnpm test:e2e -- --grep="performance"
          
          # Check route performance
          curl -w "@curl-format.txt" -o /dev/null -s http://localhost:3000/
          curl -w "@curl-format.txt" -o /dev/null -s http://localhost:3000/quotes
          curl -w "@curl-format.txt" -o /dev/null -s http://localhost:3000/users

      - name: Create curl format file
        run: |
          cat > curl-format.txt << 'EOF'
          time_namelookup:  %{time_namelookup}\n
          time_connect:     %{time_connect}\n
          time_appconnect:   %{time_appconnect}\n
          time_pretransfer:  %{time_pretransfer}\n
          time_redirect:     %{time_redirect}\n
          time_starttransfer: %{time_starttransfer}\n
          time_total:       %{time_total}\n
          EOF

  # Performance Summary
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [performance-tests, lighthouse-audit, bundle-size-monitor, performance-regression]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Performance Summary
        run: |
          echo "## E6 Performance & Analytics Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Budget Check | ${{ needs.performance-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse-audit.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Size Monitor | ${{ needs.bundle-size-monitor.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Regression | ${{ needs.performance-regression.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle Size: Target < 500KB total, < 200KB per chunk" >> $GITHUB_STEP_SUMMARY
          echo "- Core Web Vitals: LCP < 2.5s, FID < 100ms, CLS < 0.1" >> $GITHUB_STEP_SUMMARY
          echo "- Route Performance: < 1s load time" >> $GITHUB_STEP_SUMMARY
          echo "- Code Splitting: All routes lazy loaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review bundle analysis reports" >> $GITHUB_STEP_SUMMARY
          echo "2. Address performance regressions" >> $GITHUB_STEP_SUMMARY
          echo "3. Optimize slow routes and components" >> $GITHUB_STEP_SUMMARY

      - name: Fail if performance tests failed
        if: needs.performance-tests.result == 'failure' || needs.bundle-size-monitor.result == 'failure'
        run: |
          echo "❌ Performance Gate Failed - Bundle budgets exceeded or performance regressions detected"
          exit 1

      - name: Success message
        if: needs.performance-tests.result == 'success' && needs.bundle-size-monitor.result == 'success'
        run: |
          echo "✅ All Performance Gates Passed - Ready for deployment"
