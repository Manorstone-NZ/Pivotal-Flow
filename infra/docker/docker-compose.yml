version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=pivotal_e2e
      - POSTGRES_USER=pivotal
      - POSTGRES_PASSWORD=pivotal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivotal -d pivotal_e2e"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pivotal-flow

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pivotal-flow

volumes:
  postgres_data:
  redis_data:

networks:
  pivotal-flow:
    driver: bridge