version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://pivotal:pivotal@postgres:5432/pivotal_e2e
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=e2e-test-secret-key
      - PORT=3000
    volumes:
      - ../../apps/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pivotal-flow

  # Frontend Application
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:3000/api/v1
      - VITE_BACKEND_URL=http://backend:3000
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pivotal-flow

networks:
  pivotal-flow:
    external: true
